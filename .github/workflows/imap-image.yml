name: imap-image

# Build the postern-imap door image and push it to GHCR.
#
# WHY: the 993 IMAP door is moving off the host systemd+venv install onto a
# versioned container image (CI -> GHCR -> Swarm). The image is the unit of
# deploy; the Swarm stack pins it by the immutable git short-SHA tag this
# workflow produces, so `docker service update --image ...:<sha>` is exact.
#
# After a green publish (version tag or manual dispatch), dispatches fleet-chezmoi `postern-door-roll` to pin the image on
# the door host and redeploy `postern-imap` (requires org secret FLEET_DISPATCH_TOKEN).
#
# ARTIFACT SMOKE (#543): `build` always loads the image into the runner docker and
# runs it before the job can succeed. `dispatch-roll` needs `build`, so a non-importing
# (or non-greeting) image cannot reach a door. Source-level `gate` is necessary but not
# sufficient -- #539 shipped an image whose main module could not be imported because
# nothing between build and roll ever started the artifact.
#
# Triggers:
#   - push to main that touches imap/** (or this workflow): rebuild on real changes,
#     not on every unrelated main push.
#   - a v* tag: cut a release-tagged image.
#   - workflow_dispatch: a reliable manual build (also the dependable path for a
#     release tag whose commit did not itself change imap/**, since GitHub ANDs the
#     paths filter onto tag pushes).
#
# ORDERING (#418): the shared `preflight` job runs first and every job below
# depends on it (transitively), so a tag-hostile release cannot build and
# roll-dispatch a door image while the release + publish workflows fail. On the
# v1.0.5 cut, BOTH door images built and rolled off a tag that could not produce
# a release. The per-job "is this commit on main" asserts this workflow used to
# carry three copies of now live in that one gate.
#
# Runner: GitHub-hosted ubuntu-latest. PUBLIC repo -> fork-safe hosted runner, per
# the house CI policy (matches ci.yml / deploy.yml). The image is a slim Python base,
# so no disk-reclaim step is needed (that is only for the large CUDA images).
on:
  push:
    branches: [main]
    paths:
      - 'imap/**'
      - '.github/workflows/imap-image.yml'
    tags:
      - 'v*'
  workflow_dispatch: {}

# Least privilege: read the repo, write GHCR packages. Nothing else.
permissions:
  contents: read
  packages: write

# A newer push to the same ref supersedes an in-flight build.
concurrency:
  group: imap-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/skyphusion-labs/postern-imap

jobs:

  # Shared tag gate (#418): commit-on-main ancestry on every ref, plus the full
  # tag lockstep (version pins, CHANGELOG section) when the ref is a v* tag.
  preflight:
    uses: ./.github/workflows/tag-preflight.yml
    with:
      track: release

  # Gate: the same checks ci.yml runs for imap (mypy type gate + Twisted trial
  # suite), so the image is only built from code that passes the project gate.
  # CI parity is the house convention (the tsc-equivalent must be green first).
  #
  # INCIDENT postern#539: this was pinned to 3.12 while `build` below produces an
  # image FROM python:3.14-slim -- so THIS is the exact gate that waved the broken
  # v1.3.7 image through: it passed on 3.12 (686 trial tests + mypy green) for code
  # that could not even be IMPORTED on the interpreter the image it gated actually
  # ships. Pin to the same version family `build`'s Dockerfile is FROM.
  gate:
    needs: preflight
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: imap
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      # Install the package with the SAME extras the runtime image ships
      # (.[tls,ldap]) plus dev (mypy), so the gate resolves exactly what we deploy.
      - run: pip install -e '.[dev,tls,ldap]'
      - run: python -m mypy
      - run: python -m twisted.trial posternimap.tests

  build:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Log in to GHCR
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # Immutable git short-SHA (bare, the pin target for `service update
          # --image`), a moving `latest` on the default branch, and the v* tag
          # on a release.
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag

      - uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./imap
          file: ./imap/Dockerfile
          # load=true puts the single-platform image into the runner's docker so
          # the smoke step can `docker run` it. Compatible with push for one
          # platform (linux/amd64). Without load, the artifact only exists in
          # the buildx cache / GHCR and never starts on this runner (#543).
          load: true
          push: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The runtime target is x86_64; a single linux/amd64 image keeps the GHCR
          # package and the short-SHA digest clean for swarm pinning.
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # #543: verify the ARTIFACT, not only the source tree. Import alone would
      # have blocked the #539 outage (main module failed to import on 3.14). The
      # greeting check is the stronger bind-and-answer proof with stub env, no
      # credentials, no network to a real store.
      - name: Artifact smoke
        run: |
          set -euo pipefail
          # metadata-action type=sha,format=short tags with the first 7 of GITHUB_SHA.
          tag="${GITHUB_SHA:0:7}"
          image="${{ env.IMAGE }}:${tag}"
          echo "smoke: image=${image}"

          echo "smoke: import posternimap.server"
          docker run --rm "$image" python -c "import posternimap.server"

          name="postern-imap-smoke-${GITHUB_SHA:0:7}"
          cleanup() { docker rm -f "$name" >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          # Plain IMAP on an unprivileged port; TLS paths unset. POSTERN_API_URL
          # is required by config but is never contacted for the greeting.
          docker run -d --name "$name" \
            -e POSTERN_API_URL=http://127.0.0.1:9 \
            -e POSTERN_IMAP_HOST=0.0.0.0 \
            -e POSTERN_IMAP_PORT=1143 \
            -p 127.0.0.1:1143:1143 \
            "$image"

          greeting=""
          for _ in $(seq 1 30); do
            if greeting=$(timeout 2 bash -c 'exec 3<>/dev/tcp/127.0.0.1/1143; IFS= read -r line <&3; printf %s "$line"' 2>/dev/null); then
              if printf '%s\n' "$greeting" | grep -qE '^\* OK'; then
                echo "smoke: IMAP greeting ok: ${greeting}"
                exit 0
              fi
            fi
            # Still starting, or crashed -- bail early if the container died.
            if ! docker inspect -f '{{.State.Running}}' "$name" 2>/dev/null | grep -q true; then
              echo "smoke: container exited before greeting" >&2
              docker logs "$name" >&2 || true
              exit 1
            fi
            sleep 0.5
          done
          echo "smoke: no IMAP * OK greeting from ${image}" >&2
          docker logs "$name" >&2 || true
          exit 1

  # Gated on build (which includes artifact smoke). A failed import/greeting
  # fails build, so this job never dispatches a non-starting image (#543).
  dispatch-roll:
    needs: build
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Dispatch postern-imap roll to fleet-chezmoi
        env:
          FLEET_DISPATCH_TOKEN: ${{ secrets.FLEET_DISPATCH_TOKEN }}
        run: bash .github/scripts/dispatch-fleet-postern-door-roll.sh imap skyphusion-labs/postern-imap
