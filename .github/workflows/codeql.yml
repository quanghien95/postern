name: CodeQL

# Estate standard: in-repo CodeQL for JS/TS + Actions. PR trigger unfiltered so
# stacked PRs still get analysis. Schedule weekly.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "20 4 * * 0"

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v7
      # No setup-node / install step: both matrix legs run build-mode: none, so
      # CodeQL extracts from source only and never needs node_modules. The
      # javascript-typescript leg used to set `cache: npm`, but this repo has no
      # ROOT lockfile (they live at inbound/, mcp/, webmail/e2e/), so setup-node
      # failed every run with "Dependencies lock file is not found" -- dropping
      # the unneeded steps is simpler and more correct than pointing the cache
      # at one of three lockfiles the analysis does not read anyway.
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
