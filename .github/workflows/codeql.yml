name: CodeQL

# Estate standard: in-repo CodeQL for every language this repo actually
# contains. PR trigger unfiltered so stacked PRs still get analysis. Schedule
# weekly.
#
# #579/#580, CORRECTED (this comment replaces an earlier version landed in
# commit b64a1ad that mischaracterized the finding -- history is not
# rewritten, this is the follow-up correction). The `code-scanning/analyses`
# API defaults to the DEFAULT BRANCH; reading main-only data first read as
# "the repo went dark on three languages", which is wrong. GitHub's default
# setup was, and is, still enabled and still analyzes all four languages
# (actions, javascript-typescript, go, python) ON PULL REQUESTS -- that
# never stopped (provable on postern#580 itself: a separate
# `dynamic/github-code-scanning/codeql` run passes go and python alongside
# this workflow's own). What actually stopped is PUBLICATION TO
# refs/heads/main specifically: the last default-setup upload for
# javascript-typescript/go/python against main was 2026-08-06T04:41Z, and
# since 08-07 (when #577 added this advanced workflow) only /language:actions
# has published there, because this workflow also runs on push to main and
# its javascript-typescript leg died in actions/setup-node before ever
# uploading (no root lockfile; they live at inbound/, mcp/, webmail/e2e/). So
# main's STORED results for three languages went stale while PR-time
# analysis kept covering all four: a publication gap on the default branch,
# not an unanalyzed repo.
#
# The matrix below is widened to all four languages anyway: PR coverage was
# never actually lost, but this workflow is what publishes results AGAINST
# MAIN, and that publication had gone stale for three of them. Fixing only
# the lockfile cache would have revived javascript-typescript but left go and
# python's main-branch results stale indefinitely (neither had a matrix row
# at all). Whether the estate keeps an advanced CodeQL workflow alongside
# default setup at all is a separate open question (fleet-chezmoi #1645);
# this is the correct interim state under the standard as it stands today.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "20 4 * * 0"

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          # Go does not support build-mode: none (compiled language; verified
          # against GitHub's own build-mode support docs). relay/ is an
          # ordinary Go module, so autobuild is expected to work without a
          # manual build step.
          - language: go
            build-mode: autobuild
          - language: python
            build-mode: none
    steps:
      - uses: actions/checkout@v7
      # setup-node / install: javascript-typescript only, and only because it
      # used to be required for `cache: npm` -- build-mode: none means CodeQL
      # never needs node_modules for THIS language either, so there is no
      # install step at all, just nothing to set up for the other three
      # languages. This repo has no ROOT lockfile (they live at inbound/,
      # mcp/, webmail/e2e/), which is what made `cache: npm` fail every run
      # with "Dependencies lock file is not found" before this fix.
      #
      # setup-go: go only. autobuild needs a real Go toolchain on PATH; track
      # relay/go.mod the same way ci.yml's own relay job does, so CodeQL never
      # drifts from the toolchain the code actually builds with.
      - uses: actions/setup-go@v7
        if: matrix.language == 'go'
        with:
          go-version-file: relay/go.mod
          cache-dependency-path: relay/go.sum
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - uses: github/codeql-action/autobuild@v4
        if: matrix.build-mode == 'autobuild'
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
